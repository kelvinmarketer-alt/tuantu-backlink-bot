name: Backlink Bot

on:
  schedule:
    - cron: '17 3 * * *'      # 03:17 UTC = 10:17 giờ VN — phút lẻ + giờ vắng, né kẹt cron GitHub & WAF soi IP lúc cao điểm
  workflow_dispatch:           # cho phép bấm chạy tay

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: "TEMP: dò chat/nhóm qua getUpdates"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, json
          t=os.environ["TELEGRAM_TOKEN"]
          r=requests.get(f"https://api.telegram.org/bot{t}/getMe",timeout=20).json()
          print("[getMe]", r.get("result",{}).get("username"), "ok=",r.get("ok"))
          u=requests.get(f"https://api.telegram.org/bot{t}/getUpdates",timeout=20).json()
          seen=set()
          for it in u.get("result",[]):
              for k in ("message","channel_post","my_chat_member"):
                  ch=(it.get(k) or {}).get("chat")
                  if ch and ch["id"] not in seen:
                      seen.add(ch["id"])
                      cid=str(ch["id"]); print("[CHAT] spaced=", " ".join(cid), "| hex=", hex(ch["id"]), "|", ch.get("type"), "|", ch.get("title"))
          if not seen: print("[CHAT] (getUpdates rỗng — chưa có tin gần đây hoặc bot chưa ở nhóm nào)")
          PY

      - name: Run backlink bot
        run: python backlink_bot.py
        env:
          SITE_URL:         ${{ secrets.SITE_URL }}
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          SHEET_TAB:        ${{ secrets.SHEET_TAB }}
          GCP_SA_JSON:      ${{ secrets.GCP_SA_JSON }}
          TELEGRAPH_TOKEN:  ${{ secrets.TELEGRAPH_TOKEN }}
          MAX_NEW:          ${{ secrets.MAX_NEW }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
